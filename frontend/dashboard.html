<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MuniMood — Tablero de Comando</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="mm-app-bg">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg mm-navbar sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
      <i class="bi bi-thermometer-half fs-4"></i>
      <span class="fw-bold">MuniMood</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Tablero</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="sources.html"><i class="bi bi-rss me-1"></i>Fuentes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="config.html"><i class="bi bi-gear me-1"></i>Configuración</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small" id="navUsername"></span>
        <button class="btn btn-outline-light btn-sm" id="btnLogout">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h2 class="h4 fw-bold mb-0">Tablero de Comando</h2>
      <p class="text-muted small mb-0" id="lastUpdated">Actualizando...</p>
    </div>
    <button class="btn btn-primary btn-sm" id="btnRefreshData">
      <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
    </button>
  </div>

  <!-- KPIs -->
  <div class="row g-3 mb-4" id="kpiRow">
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-rss fs-2 mm-icon-blue mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiFuentes">—</div>
          <div class="small text-muted">Fuentes</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-newspaper fs-2 mm-icon-blue mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiPosts">—</div>
          <div class="small text-muted">Posteos</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-chat-dots fs-2 mm-icon-blue mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiComments">—</div>
          <div class="small text-muted">Comentarios</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-hand-thumbs-up fs-2 mm-icon-green mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiPositive">—</div>
          <div class="small text-muted">Positivos (<span id="kpiPosPct">—</span>)</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-hand-thumbs-down fs-2 mm-icon-red mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiNegative">—</div>
          <div class="small text-muted">Negativos (<span id="kpiNegPct">—</span>)</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2">
      <div class="card mm-kpi-card h-100">
        <div class="card-body text-center">
          <i class="bi bi-dash-circle fs-2 mm-icon-gray mb-2"></i>
          <div class="h4 fw-bold mb-0" id="kpiNeutral">—</div>
          <div class="small text-muted">Neutrales</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Gráfico global + Semáforo por eje -->
  <div class="row g-4">
    <!-- Gráfico de Dona -->
    <div class="col-lg-4">
      <div class="card mm-card h-100">
        <div class="card-header mm-card-header">
          <i class="bi bi-pie-chart me-2"></i>Distribución Global
        </div>
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
          <canvas id="chartGlobal" style="max-height:260px"></canvas>
          <div id="chartLegend" class="mt-3 w-100"></div>
        </div>
      </div>
    </div>

    <!-- Semáforo por eje -->
    <div class="col-lg-8">
      <div class="card mm-card">
        <div class="card-header mm-card-header d-flex align-items-center justify-content-between">
          <span><i class="bi bi-traffic-light me-2"></i>Semáforo por Eje Temático</span>
          <div id="semaphoreScaleBadge" class="small text-muted"></div>
        </div>
        <div class="card-body p-0">
          <div id="semaphoreContainer" class="mm-semaphore-grid p-3">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border spinner-border-sm me-2"></div>Cargando...
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /container -->

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toastMsg" class="toast align-items-center" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
