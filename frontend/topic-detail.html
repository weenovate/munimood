<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MuniMood — Detalle de Eje</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="mm-app-bg">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg mm-navbar sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
      <i class="bi bi-thermometer-half fs-4"></i>
      <span class="fw-bold">MuniMood</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Tablero</a></li>
        <li class="nav-item"><a class="nav-link" href="sources.html"><i class="bi bi-rss me-1"></i>Fuentes</a></li>
        <li class="nav-item"><a class="nav-link" href="config.html"><i class="bi bi-gear me-1"></i>Configuración</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small" id="navUsername"></span>
        <button class="btn btn-outline-light btn-sm" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none">Tablero</a></li>
      <li class="breadcrumb-item active" id="bcTopic">Eje</li>
    </ol>
  </nav>

  <!-- Header del tema -->
  <div class="d-flex align-items-center gap-3 mb-4" id="topicHeader">
    <div class="mm-topic-icon-lg" id="topicIconBadge">
      <i class="bi bi-circle fs-2" id="topicIcon"></i>
    </div>
    <div>
      <h2 class="h4 fw-bold mb-0" id="topicTitle">Cargando...</h2>
      <div id="topicStats" class="text-muted small"></div>
    </div>
  </div>

  <!-- Vista: Lista de Posts -->
  <div id="viewPosts">
    <div class="card mm-card">
      <div class="card-header mm-card-header d-flex align-items-center justify-content-between">
        <span><i class="bi bi-list-ul me-2"></i>Notas Relevadas</span>
        <div id="postsPagination" class="d-flex align-items-center gap-2"></div>
      </div>
      <div class="card-body p-0">
        <div id="postsTableWrap">
          <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div>Cargando notas...
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Vista: Detalle de Post -->
  <div id="viewPostDetail" class="d-none">
    <div class="d-flex align-items-center gap-2 mb-3">
      <button class="btn btn-outline-secondary btn-sm" id="btnBackToPosts">
        <i class="bi bi-arrow-left me-1"></i>Volver a notas
      </button>
    </div>

    <div class="row g-4">
      <!-- Info del post -->
      <div class="col-lg-8">
        <div class="card mm-card">
          <div class="card-header mm-card-header">
            <i class="bi bi-newspaper me-2"></i>Detalle de la Nota
          </div>
          <div class="card-body">
            <h5 id="detailTitle" class="fw-semibold mb-3"></h5>
            <div class="d-flex flex-wrap gap-3 mb-3">
              <span class="badge mm-badge-source" id="detailSource"></span>
              <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span id="detailDate"></span></span>
              <a href="#" target="_blank" id="detailUrl" class="small text-decoration-none">
                <i class="bi bi-box-arrow-up-right me-1"></i>Ver publicación original
              </a>
            </div>
            <div class="mm-post-content p-3 rounded mb-0" id="detailContent"></div>
          </div>
        </div>
      </div>

      <!-- Métricas del post -->
      <div class="col-lg-4">
        <div class="card mm-card mb-3">
          <div class="card-header mm-card-header">
            <i class="bi bi-bar-chart me-2"></i>Sentimiento
          </div>
          <div class="card-body">
            <canvas id="chartPostSentiment" style="max-height:180px"></canvas>
            <div class="row text-center mt-3">
              <div class="col-6">
                <div class="h5 fw-bold mm-text-green" id="detailPosCnt">—</div>
                <div class="small text-muted">Positivos</div>
                <div class="small fw-semibold mm-text-green" id="detailPosPct"></div>
              </div>
              <div class="col-6">
                <div class="h5 fw-bold mm-text-red" id="detailNegCnt">—</div>
                <div class="small text-muted">Negativos</div>
                <div class="small fw-semibold mm-text-red" id="detailNegPct"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Frases negativas -->
        <div class="card mm-card">
          <div class="card-header mm-card-header">
            <i class="bi bi-exclamation-triangle me-2 text-warning"></i>Conceptos a Mejorar
          </div>
          <div class="card-body p-0">
            <div id="negPhrasesList" class="list-group list-group-flush mm-phrases-list">
              <div class="text-center py-3 text-muted small">Sin datos suficientes</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toastMsg" class="toast align-items-center" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/topic-detail.js"></script>
</body>
</html>
